<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="peachGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FBF8F5" />
      <stop offset="60%" stop-color="#EDDCD3" />
      <stop offset="100%" stop-color="#DFC3B2" />
    </radialGradient>
    <linearGradient id="batteryRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97768" />
      <stop offset="100%" stop-color="#B85141" />
    </linearGradient>
  </defs>

  <!-- Square Cover Background -->
  <rect width="600" height="600" rx="28" fill="url(#peachGlow)" />
  <rect x="24" y="24" width="552" height="552" rx="20" fill="none" stroke="#9E745C" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Cute Battery Illustration -->
  <g transform="translate(190, 160)">
    <!-- Battery Outer Shell -->
    <rect x="20" y="40" width="180" height="100" rx="22" fill="#FAF8F5" stroke="#252321" stroke-width="6" />
    <!-- Positive Terminal Nub -->
    <path d="M 200 70 C 208 70, 214 76, 214 84 V 96 C 214 104, 208 110, 200 110 Z" fill="#252321" />

    <!-- 2% Low Battery Fill Bar -->
    <rect x="34" y="54" width="24" height="72" rx="10" fill="url(#batteryRed)" />

    <!-- Cute Sleepy Face inside Battery -->
    <!-- Closed smiling eyes (U shape) -->
    <path d="M 96 90 Q 106 100 116 90" stroke="#252321" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 136 90 Q 146 100 156 90" stroke="#252321" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <!-- Rosy Blush Cheeks -->
    <circle cx="92" cy="98" r="6" fill="#DFC3B2" />
    <circle cx="160" cy="98" r="6" fill="#DFC3B2" />
    <!-- Tiny mouth -->
    <circle cx="126" cy="100" r="3.5" fill="#252321" />

    <!-- Snoozing "Zzz" Floating -->
    <text x="180" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#9E745C">Z</text>
    <text x="198" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#9E745C">z</text>
    <text x="210" y="2" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#9E745C">z</text>
  </g>

  <!-- Typography -->
  <text x="300" y="390" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" letter-spacing="2" fill="#252321">LOW BATTERY</text>
  <text x="300" y="425" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="#9E745C">PLEASE RECHARGE</text>

  <!-- Subtext -->
  <text x="300" y="490" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-style="italic" fill="#635E59">Resting is part of the work.</text>
</svg>
