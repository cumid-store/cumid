<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="overdriveBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2E2825" />
      <stop offset="65%" stop-color="#1E1A18" />
      <stop offset="100%" stop-color="#12100F" />
    </radialGradient>
    <linearGradient id="tachometerRedline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC3B2" />
      <stop offset="60%" stop-color="#D97768" />
      <stop offset="100%" stop-color="#B85141" />
    </linearGradient>
  </defs>

  <!-- Square Cover Background -->
  <rect width="600" height="600" rx="28" fill="url(#overdriveBg)" />
  <rect x="24" y="24" width="552" height="552" rx="20" fill="none" stroke="#635E59" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Tachometer Dial & Racing Telemetry Line Art -->
  <g transform="translate(300, 240)">
    <!-- Main Outer Tachometer Arc (240 deg arc) -->
    <path d="M -130 75 A 150 150 0 1 1 130 75" fill="none" stroke="#3D3936" stroke-width="8" stroke-linecap="round" />
    
    <!-- Redline Zone Arc (Last 60 deg) -->
    <path d="M 75 -130 A 150 150 0 0 1 130 75" fill="none" stroke="url(#tachometerRedline)" stroke-width="10" stroke-linecap="round" />

    <!-- RPM Tick Marks -->
    <!-- Tick 0 to 8 -->
    <line x1="-106" y1="61" x2="-120" y2="69" stroke="#8C8782" stroke-width="3" />
    <line x1="-122" y1="0" x2="-138" y2="0" stroke="#8C8782" stroke-width="3" />
    <line x1="-86" y1="-86" x2="-98" y2="-98" stroke="#8C8782" stroke-width="3" />
    <line x1="0" y1="-122" x2="0" y2="-138" stroke="#8C8782" stroke-width="3" />
    <line x1="86" y1="-86" x2="98" y2="-98" stroke="#D97768" stroke-width="4" />
    <line x1="122" y1="0" x2="138" y2="0" stroke="#D97768" stroke-width="4" />
    <line x1="106" y1="61" x2="120" y2="69" stroke="#B85141" stroke-width="4" />

    <!-- Dial Numbers: 1, 3, 5, 7, 8 (x1000 RPM) -->
    <text x="-95" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', monospace" font-size="14" font-weight="700" fill="#8C8782">2</text>
    <text x="-65" y="-65" text-anchor="middle" font-family="'Plus Jakarta Sans', monospace" font-size="14" font-weight="700" fill="#8C8782">4</text>
    <text x="0" y="-95" text-anchor="middle" font-family="'Plus Jakarta Sans', monospace" font-size="14" font-weight="700" fill="#8C8782">6</text>
    <text x="65" y="-65" text-anchor="middle" font-family="'Plus Jakarta Sans', monospace" font-size="14" font-weight="700" fill="#D97768">7</text>
    <text x="95" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', monospace" font-size="14" font-weight="700" fill="#B85141">8</text>

    <!-- Center Hub & Redline Needle pointing near 7,500 RPM -->
    <circle cx="0" cy="0" r="14" fill="#252321" stroke="#DFC3B2" stroke-width="2" />
    <line x1="0" y1="0" x2="88" y2="-76" stroke="#D97768" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="5" fill="#FAF8F5" />

    <!-- Aerodynamic Speed Contours Behind Needle -->
    <path d="M -160 110 C -80 90, 80 90, 160 110" stroke="#DFC3B2" stroke-width="1.5" stroke-opacity="0.3" fill="none" />
    <path d="M -140 125 C -70 110, 70 110, 140 125" stroke="#DFC3B2" stroke-width="1" stroke-opacity="0.2" fill="none" />
  </g>

  <!-- Typography -->
  <text x="300" y="475" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="30" font-weight="800" letter-spacing="2.5" fill="#F7F4EF">PLANS IN</text>
  <text x="300" y="515" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" letter-spacing="5" fill="#DFC3B2">OVERDRIVE</text>

  <!-- Technical Subtext -->
  <text x="300" y="550" text-anchor="middle" font-family="'Inter', monospace" font-size="11" letter-spacing="4" fill="#8C8782">TELEMETRY // REDLINE RPM</text>
</svg>
