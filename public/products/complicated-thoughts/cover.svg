<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="catBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FCFBF9" />
      <stop offset="70%" stop-color="#F7F4EF" />
      <stop offset="100%" stop-color="#ECE7DE" />
    </radialGradient>
    <linearGradient id="yarnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5B84" />
      <stop offset="100%" stop-color="#A69ABB" />
    </linearGradient>
  </defs>

  <!-- Square Cover Background -->
  <rect width="600" height="600" rx="28" fill="url(#catBg)" />
  <rect x="24" y="24" width="552" height="552" rx="20" fill="none" stroke="#252321" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Playful Tangled Yarn Lines representing Complicated Thoughts -->
  <path d="M 120 180 C 180 100, 240 260, 310 160 C 380 60, 460 220, 500 150 C 530 100, 470 300, 390 280 C 310 260, 280 340, 200 320 C 130 300, 100 240, 160 200 C 220 160, 380 200, 360 300" 
        stroke="url(#yarnGrad)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75" />

  <!-- Illustrated Curious Cat Face and Paws -->
  <g transform="translate(190, 220)">
    <!-- Cat Head Contour -->
    <path d="M 70 80 C 30 80, 10 110, 10 150 C 10 200, 45 220, 110 220 C 175 220, 210 200, 210 150 C 210 110, 190 80, 150 80 Z" fill="#252321" />

    <!-- Left Ear -->
    <polygon points="25,95 45,25 80,82" fill="#252321" />
    <polygon points="35,90 50,45 72,82" fill="#DFC3B2" />

    <!-- Right Ear -->
    <polygon points="195,95 175,25 140,82" fill="#252321" />
    <polygon points="185,90 170,45 148,82" fill="#DFC3B2" />

    <!-- Big Inquisitive Eyes -->
    <ellipse cx="65" cy="140" rx="14" ry="18" fill="#F7F4EF" />
    <ellipse cx="155" cy="140" rx="14" ry="18" fill="#F7F4EF" />
    <!-- Pupils looking up at the yarn coils -->
    <ellipse cx="67" cy="134" rx="7" ry="11" fill="#252321" />
    <ellipse cx="157" cy="134" rx="7" ry="11" fill="#252321" />
    <circle cx="70" cy="130" r="2.5" fill="#FFFFFF" />
    <circle cx="160" cy="130" r="2.5" fill="#FFFFFF" />

    <!-- Tiny Pink Nose & Whiskers -->
    <polygon points="110,165 104,157 116,157" fill="#DFC3B2" />
    <!-- Mouth -->
    <path d="M 104 167 Q 110 172 116 167" stroke="#F7F4EF" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Whiskers Left -->
    <line x1="45" y1="160" x2="5" y2="152" stroke="#F7F4EF" stroke-width="2" stroke-linecap="round" />
    <line x1="45" y1="168" x2="10" y2="172" stroke="#F7F4EF" stroke-width="2" stroke-linecap="round" />
    <!-- Whiskers Right -->
    <line x1="175" y1="160" x2="215" y2="152" stroke="#F7F4EF" stroke-width="2" stroke-linecap="round" />
    <line x1="175" y1="168" x2="210" y2="172" stroke="#F7F4EF" stroke-width="2" stroke-linecap="round" />

    <!-- Paws batting at yarn -->
    <ellipse cx="60" cy="225" rx="18" ry="12" fill="#FAF8F5" stroke="#252321" stroke-width="3" />
    <ellipse cx="160" cy="225" rx="18" ry="12" fill="#FAF8F5" stroke="#252321" stroke-width="3" />
  </g>

  <!-- Typography -->
  <text x="300" y="495" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" letter-spacing="1.5" fill="#252321">COMPLICATED</text>
  <text x="300" y="530" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" letter-spacing="1.5" fill="#6B5B84">THOUGHTS</text>
</svg>
