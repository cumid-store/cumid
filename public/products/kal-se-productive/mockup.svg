<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <filter id="kalSeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#252321" flood-opacity="0.18" />
    </filter>
    <linearGradient id="spiralCoilMetallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C8782" />
      <stop offset="35%" stop-color="#E5E4E2" />
      <stop offset="70%" stop-color="#8C8782" />
      <stop offset="100%" stop-color="#4D4844" />
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="#FAF8F5" />

  <g filter="url(#kalSeShadow)">
    <rect x="122" y="108" width="360" height="364" rx="18" fill="#ECE7DE" stroke="#D5CBB9" stroke-width="1" />
    <rect x="120" y="105" width="360" height="364" rx="18" fill="#F7F4EF" stroke="#E4DDD0" stroke-width="1" />
    
    <g transform="translate(118, 102) scale(0.6)">
      <rect width="600" height="600" rx="28" fill="#191716" />
      <rect x="24" y="24" width="552" height="552" rx="20" fill="none" stroke="#BAACD1" stroke-width="2" stroke-opacity="0.3" />
      <!-- Clock Motif Mini -->
      <path d="M 300 130 C 360 130, 410 180, 410 240 C 410 310, 380 350, 350 380 C 320 410, 280 430, 250 410 C 220 390, 200 340, 200 260 C 200 190, 240 130, 300 130 Z" fill="#6B5B84" />
      <path d="M 300 142 C 350 142, 394 186, 394 240 C 394 300, 368 336, 340 362 C 312 388, 276 408, 252 390 C 228 372, 214 330, 214 260 C 214 198, 250 142, 300 142 Z" fill="#F7F4EF" />
      <circle cx="300" cy="250" r="6" fill="#252321" />
      <line x1="300" y1="250" x2="350" y2="290" stroke="#252321" stroke-width="6" stroke-linecap="round" />
      <line x1="300" y1="250" x2="290" y2="180" stroke="#6B5B84" stroke-width="4" stroke-linecap="round" />

      <text x="300" y="475" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="800" letter-spacing="2" fill="#F7F4EF">KAL SE</text>
      <text x="300" y="520" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#BAACD1">PRODUCTIVE</text>
    </g>
  </g>

