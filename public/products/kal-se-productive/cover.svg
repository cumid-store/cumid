<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="warmOchreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B2826" />
      <stop offset="100%" stop-color="#191716" />
    </linearGradient>
    <linearGradient id="clockFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F4EF" />
      <stop offset="100%" stop-color="#DFD8CA" />
    </linearGradient>
  </defs>

  <!-- Square Cover Background -->
  <rect width="600" height="600" rx="28" fill="url(#warmOchreGrad)" />
  <rect x="24" y="24" width="552" height="552" rx="20" fill="none" stroke="#BAACD1" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Playful Melting / Relaxed Clock Motif -->
  <!-- Clock casing with a lazy drape/curve -->
  <g transform="translate(180, 110)">
    <!-- Clock Outer Shadow / Rim -->
    <path d="M 120 20 C 180 20, 230 70, 230 130 C 230 200, 200 240, 170 270 C 140 300, 100 320, 70 300 C 40 280, 20 230, 20 150 C 20 80, 60 20, 120 20 Z" fill="#6B5B84" />
    <!-- Clock Face -->
    <path d="M 120 32 C 170 32, 214 76, 214 130 C 214 190, 188 226, 160 252 C 132 278, 96 298, 72 280 C 48 262, 34 220, 34 150 C 34 88, 70 32, 120 32 Z" fill="url(#clockFace)" />

    <!-- Clock Hour Numbers (Snoozing numbers) -->
    <!-- 12 -->
    <text x="120" y="65" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#252321">12</text>
    <!-- 3 -->
    <text x="195" y="136" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#252321">3</text>
    <!-- 6 (sliding down) -->
    <text x="150" y="235" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#252321">6</text>
    <!-- 9 -->
    <text x="50" y="155" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#252321">9</text>

    <!-- Clock Center Pivot -->
    <circle cx="120" cy="140" r="5" fill="#252321" />

    <!-- Drooping Clock Hands pointing towards "tomorrow" -->
    <line x1="120" y1="140" x2="165" y2="175" stroke="#252321" stroke-width="4" stroke-linecap="round" />
    <line x1="120" y1="140" x2="110" y2="80" stroke="#6B5B84" stroke-width="3" stroke-linecap="round" />

    <!-- Drip drops symbolizing melting time -->
    <circle cx="82" cy="315" r="4.5" fill="#6B5B84" />
    <circle cx="95" cy="335" r="3" fill="#6B5B84" />
  </g>

  <!-- Bold Hinglish Humour Typography -->
  <text x="300" y="475" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" letter-spacing="2" fill="#F7F4EF">KAL SE</text>
  <text x="300" y="515" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="700" letter-spacing="6" fill="#BAACD1">PRODUCTIVE</text>

  <!-- Witty small quote -->
  <text x="300" y="550" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-style="italic" fill="#929C8A">"Pakka start karunga. Promise."</text>
</svg>
